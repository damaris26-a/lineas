<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perspectiva 3D 800x800</title>
    <style>
        /* Centra el canvas en la pantalla */
        body {
            margin: 0;
            background-color: #f8fafa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
        }

        /* Estilo del lienzo de 800x800 */
        canvas {
            border: 3px solid #000000;
            background-color: #ffffff;
            box-shadow: 0px 4px 30px rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body>

    <!-- Cuadrado principal de 800x800 píxeles -->
    <canvas id="miCanvas" width="800" height="800"></canvas>

    <!-- AQUÍ SE CONECTA CON TU SCRIPT INVITADO -->
    <script src="EJER.JS"></script>
</body>
</html>
